# Render Blueprint (P8.2): native Go + Python runtimes, Supabase as the database.
# Steps, costs and the CPU-only profile: docs/deploy.md.
#
# - groundedtriage-api     web (public, HTTPS by Render; REQUIRE_HTTPS adds the redirect + HSTS)
# - groundedtriage-worker  background worker (ingest -> classify -> route -> reply -> send -> monitoring)
# - groundedtriage-ml      private service (no public URL; only api/worker reach it)
#
# Secrets are never in this file: sync:false values are entered in the Render
# dashboard on first deploy; API_KEY is generated by Render.

envVarGroups:
  - name: groundedtriage-shared
    envVars:
      - key: DATABASE_URL # Supabase Session pooler string (port 5432), see .env.example
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: JUDGE_MODEL
        value: qwen/qwen3.8-27b
      - key: JUDGE_MAX_TOKENS
        value: "1000"
      - key: DRAFT_REASONING_EFFORT
        value: low
      - key: WORKER_POLL_INTERVAL
        value: 60s

services:
  - type: pserv
    name: groundedtriage-ml
    runtime: python
    region: singapore # closest Render region to the Supabase project (ap-south-1)
    plan: standard # 2 GB: torch (CPU) + bge-small + fast tier + spam filter
    rootDir: ml-service
    buildCommand: >-
      pip install --upgrade pip &&
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install ".[models]" &&
      python -m app.artifacts fetch &&
      python -c "from triage.embedder import Embedder; Embedder().load()"
    startCommand: python -m app.artifacts fetch && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - fromGroup: groundedtriage-shared
      - key: PYTHON_VERSION
        value: 3.11.14
      - key: TORCH_DEVICE # CPU-only profile
        value: cpu
      - key: MODEL_FP16
        value: "false"
      - key: HF_HOME # bge-small is downloaded at build time into the service's files
        value: /opt/render/project/src/ml-service/.hf
      - key: MODELS_DIR
        value: /opt/render/project/src/ml-service/models
      - key: MODELS_URL # https URL of `python -m app.artifacts pack` output; empty = use MODELS_DIR as is
        sync: false
      - key: MODELS_SHA256
        sync: false
      - key: SPAM_RULE
        value: support_and_ham

  - type: web
    name: groundedtriage-api
    runtime: go
    region: singapore
    plan: starter
    buildCommand: go build -o bin/api ./cmd/api && go build -o bin/migrate ./cmd/migrate
    startCommand: ./bin/api
    healthCheckPath: /health
    envVars:
      - fromGroup: groundedtriage-shared
      - key: API_KEY
        generateValue: true
      - key: API_HOST
        value: 0.0.0.0
      - key: REQUIRE_HTTPS
        value: "true"
      - key: GIN_MODE
        value: release
      - key: ML_SERVICE_URL
        fromService:
          type: pserv
          name: groundedtriage-ml
          property: hostport

  - type: worker
    name: groundedtriage-worker
    runtime: go
    region: singapore
    plan: starter
    buildCommand: go build -o bin/worker ./cmd/worker
    startCommand: ./bin/worker
    envVars:
      - fromGroup: groundedtriage-shared
      - key: MEETING_CALENDAR # no Google token on the host; use fake for a demo
        value: "off"
      - key: ML_SERVICE_URL
        fromService:
          type: pserv
          name: groundedtriage-ml
          property: hostport
