[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-triage-ml"
version = "0.1.0"
description = "ml-service for GroundedTriage: classification cascade, retrieval, grounded drafting, faithfulness gate, SCRIBE baseline and evaluation."
requires-python = ">=3.11,<3.12"
# Runtime dependencies are added by the part that first needs them.
# torch/transformers are deliberately absent until the part that needs them
# (8 GB RAM dev machine); app.device imports torch lazily.
dependencies = [
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # Fast tier (P3.1): TF-IDF + LR served in the ml-service.
    "scikit-learn>=1.5",
    "numpy>=1.26",
    # KB ingestion + retrieval (P5): Postgres/pgvector from the ml-service.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
# Dataset builders and Kaggle downloads (P2.1). kaggle>=2.2 reads KAGGLE_API_TOKEN.
data = [
    "kaggle>=2.2.4,<3",
    "pandas>=2.2",
    "pyarrow>=17",
    "langdetect>=1.0.9",
    "tabulate>=0.9",
]
# SCRIBE baseline (P2.2): BART-MNLI zero-shot + twitter-roberta sentiment.
# Heavy (~2 GB of weights at first run); runs as its own CLI, never in the
# always-on ml-service.
baseline = [
    "torch>=2.4",
    "transformers>=4.44",
]
# Inference for the fine-tuned deep tier and urgency model (P3.2, P3.3),
# loaded lazily by the ml-service. Same packages as `baseline`.
models = [
    "torch>=2.4",
    "transformers>=4.44",
]
# Evaluation plots (P2.3, P7).
eval = [
    "matplotlib>=3.8",
]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "honcho>=2.0",
    # render.yaml validation (P8.2, scripts/validate_render.py).
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "triage*", "rag*", "baseline*", "data*", "eval*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows in the generated dataset card and audit report.
"data/build.py" = ["E501"]
"data/audit.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: downloads or loads large models; skipped unless RUN_SLOW=1",
    "integration: needs TEST_DATABASE_URL; skipped when it is unset",
]
